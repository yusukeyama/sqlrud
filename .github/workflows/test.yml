name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.22.x"
          - "1.27.x"

    env:
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - run: go version
      - run: go test -race ./...
      - run: go vet ./...
